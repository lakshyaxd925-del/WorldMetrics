<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>World Statistics — WorldMetrics</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

:root{
--blue:#1677ff;
--bg:#f4f7fb;
--card:#fff;
--text:#172033;
--muted:#667085;
--border:#e4e8f0;
--footer:#101828;
}

body.dark{
--bg:#0b1220;
--card:#151f31;
--text:#f8fafc;
--muted:#aab4c4;
--border:#2b374c;
--footer:#070c16;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
background:var(--card);
border-bottom:1px solid var(--border);
padding:15px 6%;
position:sticky;
top:0;
z-index:1000;
}

.nav{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:bold;
color:var(--blue);
text-decoration:none;
}

nav{
display:flex;
gap:20px;
}

nav a{
text-decoration:none;
color:var(--muted);
font-weight:bold;
}

nav a:hover{
color:var(--blue);
}

#theme{
padding:10px;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
border-radius:10px;
cursor:pointer;
}

.hero{
text-align:center;
padding:60px 20px 30px;
}

.hero h1{
font-size:42px;
margin-bottom:12px;
}

.hero p{
color:var(--muted);
}

.container{
max-width:1150px;
margin:auto;
padding:20px;
}

.map{
height:520px;
border-radius:20px;
overflow:hidden;
border:1px solid var(--border);
margin-bottom:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:25px;
}

.card h3{
color:var(--muted);
font-size:14px;
margin-bottom:10px;
}

.number{
font-size:28px;
font-weight:bold;
color:var(--blue);
}

.creator{
text-align:center;
padding:30px;
}

.creator strong{
color:var(--blue);
}

footer{
background:var(--footer);
color:#ddd;
text-align:center;
padding:30px;
}

@media(max-width:750px){
nav{display:none}
.cards{grid-template-columns:1fr}
.map{height:400px}
}

</style>
</head>

<body>

<header>

<div class="nav">

<a class="logo" href="index.html">
🌍 WorldMetrics
</a>

<nav>
<a href="index.html">🏠 Home</a>
<a href="world.html">🌎 World</a>
<a href="countries.html">🌐 Countries</a>
<a href="compare.html">⚖️ Compare</a>
</nav>

<button id="theme">🌙</button>

</div>

</header>

<section class="hero">

<h1>🌎 World Overview</h1>

<p>
Explore countries and their locations around the world.
</p>

</section>

<div class="container">

<div id="map" class="map"></div>

<section class="cards">

<div class="card">
<h3>🌐 Countries & Territories</h3>
<div class="number" id="countries">Loading...</div>
</div>

<div class="card">
<h3>👥 Population</h3>
<div class="number">8.3B+</div>
</div>

<div class="card">
<h3>🌍 Continents</h3>
<div class="number">7</div>
</div>

</section>

</div>

<div class="creator">
✨ This website is created by
<strong>Ayan Kumar</strong>
</div>

<footer>
<strong>🌍 WorldMetrics</strong>
<br><br>
© 2026 WorldMetrics
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const theme=document.getElementById("theme");

if(localStorage.getItem("worldmetrics-theme")==="dark"){
document.body.classList.add("dark");
theme.textContent="☀️";
}

theme.onclick=()=>{
document.body.classList.toggle("dark");

const dark=
document.body.classList.contains("dark");

localStorage.setItem(
"worldmetrics-theme",
dark?"dark":"light"
);

theme.textContent=dark?"☀️":"🌙";
};


const map=L.map("map")
.setView([20,0],2);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:18,
attribution:"© OpenStreetMap contributors"
}
).addTo(map);


async function loadWorld(){

try{

const response=
await fetch(
"https://restcountries.com/v3.1/all?fields=name,cca3,latlng,population,flags"
);

const countries=
await response.json();

document.getElementById("countries")
.textContent=
countries.length;


countries.forEach(country=>{

if(!country.latlng)return;

const marker=
L.marker(country.latlng)
.addTo(map);

marker.bindPopup(`
<strong>
${country.name.common}
</strong>
<br>
👥 ${country.population
?country.population.toLocaleString()
:"N/A"}
`);

});

}catch(error){

console.error(error);

document.getElementById("countries")
.textContent="Unavailable";

}

}

loadWorld();

</script>

</body>
</html>
