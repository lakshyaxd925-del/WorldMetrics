<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countries — WorldMetrics</title>

<meta name="description"
content="Search and explore countries around the world with WorldMetrics.">

<style>
:root{
    --blue:#1677ff;
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#667085;
    --border:#e4e8f0;
    --footer:#101828;
}

body.dark{
    --bg:#0b1220;
    --card:#151f31;
    --text:#f8fafc;
    --muted:#aab4c4;
    --border:#2b374c;
    --footer:#070c16;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* HEADER */

header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 6%;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:18px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:var(--blue);
    text-decoration:none;
    white-space:nowrap;
}

nav{
    display:flex;
    gap:16px;
    margin-left:auto;
}

nav a{
    text-decoration:none;
    color:var(--muted);
    font-size:14px;
    font-weight:bold;
}

nav a:hover,
nav a.active{
    color:var(--blue);
}

/* TOP SEARCH */

.search-wrapper{
    position:relative;
    width:250px;
}

#countrySearch{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--bg);
    color:var(--text);
    outline:none;
}

#countrySearch:focus{
    border-color:var(--blue);
}

.search-results{
    position:absolute;
    top:calc(100% + 7px);
    left:0;
    right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    display:none;
    max-height:350px;
    overflow-y:auto;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.search-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
}

.search-item:last-child{
    border-bottom:none;
}

.search-item:hover{
    background:var(--bg);
}

.search-flag{
    width:28px;
    height:19px;
    object-fit:cover;
    border-radius:3px;
}

.search-name{
    font-size:14px;
    font-weight:bold;
}

/* THEME */

#theme{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:10px;
    padding:9px 11px;
    cursor:pointer;
}

/* HERO */

.hero{
    text-align:center;
    padding:60px 20px 30px;
}

.hero h1{
    font-size:45px;
    margin-bottom:12px;
}

.hero h1 span{
    color:var(--blue);
}

.hero p{
    color:var(--muted);
    font-size:17px;
}

/* MAIN SEARCH */

.main-search{
    max-width:700px;
    margin:25px auto 40px;
    padding:0 20px;
    position:relative;
}

#mainSearch{
    width:100%;
    padding:17px 20px;
    font-size:16px;
    border:1px solid var(--border);
    border-radius:15px;
    background:var(--card);
    color:var(--text);
    outline:none;
}

#mainSearch:focus{
    border-color:var(--blue);
}

#mainResults{
    top:calc(100% + 8px);
    text-align:left;
    z-index:50;
}

/* FILTERS */

.filters{
    max-width:1150px;
    margin:0 auto 25px;
    padding:0 20px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.filter-btn{
    padding:10px 17px;
    border-radius:50px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    font-weight:bold;
}

.filter-btn:hover,
.filter-btn.active{
    background:var(--blue);
    color:white;
    border-color:var(--blue);
}

/* COUNTRY GRID */

.container{
    max-width:1150px;
    margin:auto;
    padding:0 20px 60px;
}

.country-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.country-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    text-decoration:none;
    color:var(--text);
    transition:transform .2s,border-color .2s;
}

.country-card:hover{
    transform:translateY(-4px);
    border-color:var(--blue);
}

.flag-box{
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    padding:20px;
}

.flag-box img{
    max-width:100%;
    max-height:80px;
    object-fit:contain;
    border-radius:5px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.country-content{
    padding:18px;
}

.country-content h3{
    margin-bottom:8px;
    font-size:17px;
}

.country-content p{
    font-size:13px;
    color:var(--muted);
    margin:4px 0;
}

.empty,
.loading{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

/* LOAD MORE */

.load-box{
    text-align:center;
    padding-top:30px;
}

#loadMore{
    padding:13px 25px;
    border:none;
    background:var(--blue);
    color:white;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

#loadMore:hover{
    opacity:.9;
}

/* CREATOR */

.creator{
    text-align:center;
    padding:10px 20px 35px;
}

.creator-badge{
    display:inline-block;
    padding:12px 22px;
    border-radius:50px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--muted);
}

.creator-badge strong{
    color:var(--blue);
}

/* FOOTER */

footer{
    background:var(--footer);
    color:#d1d5db;
    text-align:center;
    padding:30px;
    line-height:1.7;
}

/* MOBILE */

@media(max-width:1050px){
    nav{
        display:none;
    }

    .nav{
        justify-content:space-between;
    }

    .country-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){

    .country-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .hero h1{
        font-size:35px;
    }

}

@media(max-width:500px){

    .search-wrapper{
        display:none;
    }

    .country-grid{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>
<div class="nav">

<a href="index.html" class="logo">
🌍 WorldMetrics
</a>

<nav>
<a href="index.html">🏠 Home</a>
<a href="world.html">🌎 World</a>
<a href="countries.html" class="active">🌐 Countries</a>
<a href="compare.html">⚖️ Compare</a>
<a href="rankings.html">🏆 Rankings</a>
</nav>

<div class="search-wrapper">

<input
type="text"
id="countrySearch"
placeholder="🔎 Search country..."
autocomplete="off"
>

<div
id="searchResults"
class="search-results">
</div>

</div>

<button id="theme">🌙</button>

</div>
</header>


<section class="hero">

<h1>🌐 Explore <span>Countries</span></h1>

<p>
Search and discover information about countries around the world.
</p>

</section>


<div class="main-search">

<input
type="text"
id="mainSearch"
placeholder="🔎 Search any country..."
autocomplete="off"
>

<div
id="mainResults"
class="search-results">
</div>

</div>


<div class="filters">

<button
class="filter-btn active"
data-region="All">
🌍 All
</button>

<button
class="filter-btn"
data-region="Africa">
🌍 Africa
</button>

<button
class="filter-btn"
data-region="Americas">
🌎 Americas
</button>

<button
class="filter-btn"
data-region="Asia">
🌏 Asia
</button>

<button
class="filter-btn"
data-region="Europe">
🏰 Europe
</button>

<button
class="filter-btn"
data-region="Oceania">
🌊 Oceania
</button>

</div>


<div class="container">

<div
id="countryGrid"
class="country-grid">

<div class="loading">
🌍 Loading countries...
</div>

</div>

<div class="load-box">

<button id="loadMore">
Load More Countries
</button>

</div>

</div>


<div class="creator">

<div class="creator-badge">

✨ This website is created by
<strong>Ayan Kumar</strong>

</div>

</div>


<footer>

<strong>🌍 WorldMetrics</strong>

<br>

Explore, understand and compare our world.

<br><br>

© 2026 WorldMetrics

</footer>


<script>

/* DARK MODE */

const theme =
document.getElementById("theme");

if(
localStorage.getItem("worldmetrics-theme")
=== "dark"
){
    document.body.classList.add("dark");
    theme.textContent="☀️";
}

theme.onclick=()=>{

    document.body.classList.toggle("dark");

    const dark=
    document.body.classList.contains("dark");

    localStorage.setItem(
        "worldmetrics-theme",
        dark?"dark":"light"
    );

    theme.textContent=
    dark?"☀️":"🌙";
};


/* DATA */

let countries=[];
let currentRegion="All";
let visibleCount=24;

const API_URL=
"https://restcountries.com/v3.1/all?fields=name,cca3,flags,population,region,capital";


async function loadCountries(){

    try{

        const response=
        await fetch(API_URL);

        if(!response.ok){
            throw new Error("Unable to load countries");
        }

        countries=
        await response.json();

        countries.sort((a,b)=>
            a.name.common.localeCompare(
                b.name.common
            )
        );

        renderCountries();

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "countryGrid"
        ).innerHTML=`

        <div class="empty">
        ⚠️ Unable to load countries.
        <br><br>
        Please refresh the page.
        </div>

        `;

    }

}


/* GET FILTERED COUNTRIES */

function getFilteredCountries(){

    return countries.filter(country=>{

        const matchesRegion=
        currentRegion==="All" ||
        country.region===currentRegion;

        return matchesRegion;

    });

}


/* RENDER COUNTRY CARDS */

function renderCountries(){

    const grid=
    document.getElementById(
        "countryGrid"
    );

    const filtered=
    getFilteredCountries();

    const visible=
    filtered.slice(0,visibleCount);

    grid.innerHTML="";


    if(visible.length===0){

        grid.innerHTML=`

        <div class="empty">
        No countries found.
        </div>

        `;

        return;

    }


    visible.forEach(country=>{

        const card=
        document.createElement("a");

        card.className=
        "country-card";

        card.href=
        "country.html?code="+
        encodeURIComponent(
            country.cca3
        );


        const capital=
        country.capital &&
        country.capital.length
        ?country.capital[0]
        :"N/A";


        card.innerHTML=`

        <div class="flag-box">

        <img
        src="${country.flags?.svg||""}"
        alt="${country.name.common} flag"
        >

        </div>


        <div class="country-content">

        <h3>
        ${country.name.common}
        </h3>

        <p>
        🌍 ${country.region||"Unknown"}
        </p>

        <p>
        🏛️ ${capital}
        </p>

        <p>
        👥 ${formatNumber(
            country.population||0
        )}
        </p>

        </div>

        `;


        grid.appendChild(card);

    });


    const loadButton=
    document.getElementById(
        "loadMore"
    );

    loadButton.style.display=

    visible.length>=filtered.length
    ?"none"
    :"inline-block";

}


/* FORMAT NUMBERS */

function formatNumber(number){

    if(number>=1000000000){

        return (
            number/1000000000
        ).toFixed(2)+"B";

    }

    if(number>=1000000){

        return (
            number/1000000
        ).toFixed(1)+"M";

    }

    if(number>=1000){

        return (
            number/1000
        ).toFixed(1)+"K";

    }

    return number.toLocaleString();

}


/* LOAD MORE */

document.getElementById(
    "loadMore"
).onclick=()=>{

    visibleCount+=24;

    renderCountries();

};


/* REGION FILTERS */

document
.querySelectorAll(".filter-btn")
.forEach(button=>{

    button.onclick=()=>{

        document
        .querySelectorAll(".filter-btn")
        .forEach(btn=>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        currentRegion=
        button.dataset.region;

        visibleCount=24;

        renderCountries();

    };

});


/* SEARCH SYSTEM */

function setupSearch(
    inputId,
    resultsId
){

    const input=
    document.getElementById(inputId);

    const results=
    document.getElementById(resultsId);


    input.addEventListener(
        "input",
        ()=>{

            const query=
            input.value
            .trim()
            .toLowerCase();


            if(!query){

                results.style.display="none";
                results.innerHTML="";

                return;

            }


            if(countries.length===0){

                results.innerHTML=`
                <div class="search-item">
                Loading countries...
                </div>
                `;

                results.style.display="block";

                return;

            }


            const matches=

            countries
            .filter(country=>

                country.name.common
                .toLowerCase()
                .includes(query)

            )
            .slice(0,10);


            results.innerHTML="";


            if(matches.length===0){

                results.innerHTML=`

                <div class="search-item">
                No country found
                </div>

                `;

                results.style.display="block";

                return;

            }


            matches.forEach(country=>{

                const item=
                document.createElement("div");

                item.className=
                "search-item";


                item.innerHTML=`

                <img
                class="search-flag"
                src="${country.flags?.svg||""}"
                alt=""
                >

                <div class="search-name">

                ${country.name.common}

                </div>

                `;


                item.onclick=()=>{

                    window.location.href=

                    "country.html?code="+
                    encodeURIComponent(
                        country.cca3
                    );

                };


                results.appendChild(item);

            });


            results.style.display="block";

        }
    );


    /* ENTER */

    input.addEventListener(
        "keydown",
        event=>{

            if(event.key==="Enter"){

                const query=
                input.value
                .trim()
                .toLowerCase();


                const match=

                countries.find(country=>

                    country.name.common
                    .toLowerCase()
                    .includes(query)

                );


                if(match){

                    window.location.href=

                    "country.html?code="+
                    encodeURIComponent(
                        match.cca3
                    );

                }

            }

        }
    );


    /* CLICK OUTSIDE */

    document.addEventListener(
        "click",
        event=>{

            if(
                !input.contains(event.target)&&
                !results.contains(event.target)
            ){

                results.style.display="none";

            }

        }
    );

}


setupSearch(
    "countrySearch",
    "searchResults"
);

setupSearch(
    "mainSearch",
    "mainResults"
);


/* START */

loadCountries();

</script>

</body>
</html>
