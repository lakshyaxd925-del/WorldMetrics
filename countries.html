<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Countries — WorldMetrics</title>

<style>

:root{
--blue:#1677ff;
--bg:#f4f7fb;
--card:#fff;
--text:#172033;
--muted:#667085;
--border:#e4e8f0;
--footer:#101828;
}

body.dark{
--bg:#0b1220;
--card:#151f31;
--text:#f8fafc;
--muted:#aab4c4;
--border:#2b374c;
--footer:#070c16;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
background:var(--card);
border-bottom:1px solid var(--border);
padding:15px 6%;
position:sticky;
top:0;
z-index:100;
}

.nav{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:bold;
color:var(--blue);
text-decoration:none;
}

nav{
display:flex;
gap:20px;
}

nav a{
text-decoration:none;
color:var(--muted);
font-weight:bold;
}

nav a:hover{
color:var(--blue);
}

#theme{
padding:10px;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
border-radius:10px;
cursor:pointer;
}

.hero{
text-align:center;
padding:55px 20px 30px;
}

.hero h1{
font-size:42px;
}

.hero p{
color:var(--muted);
margin-top:10px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.search{
width:100%;
padding:17px;
border-radius:13px;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
font-size:16px;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:17px;
padding:18px;
text-decoration:none;
color:var(--text);
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
border-color:var(--blue);
}

.flag{
width:100%;
height:120px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
}

.card h2{
font-size:18px;
margin-bottom:7px;
}

.card p{
color:var(--muted);
font-size:13px;
line-height:1.6;
}

.creator{
text-align:center;
padding:30px;
}

.creator strong{
color:var(--blue);
}

footer{
background:var(--footer);
color:#ddd;
text-align:center;
padding:30px;
}

@media(max-width:900px){
.grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
nav{display:none}
.grid{grid-template-columns:1fr}
.hero h1{font-size:34px}
}

</style>
</head>

<body>

<header>

<div class="nav">

<a class="logo" href="index.html">
🌍 WorldMetrics
</a>

<nav>
<a href="index.html">🏠 Home</a>
<a href="world.html">🌎 World</a>
<a href="countries.html">🌐 Countries</a>
<a href="compare.html">⚖️ Compare</a>
</nav>

<button id="theme">🌙</button>

</div>

</header>

<section class="hero">

<h1>🌐 Countries</h1>

<p>
Explore information about countries around the world.
</p>

</section>

<div class="container">

<input
id="search"
class="search"
placeholder="🔎 Search countries..."
>

<div id="countries"
class="grid">

<p>Loading countries...</p>

</div>

</div>

<div class="creator">

✨ This website is created by
<strong>Ayan Kumar</strong>

</div>

<footer>
<strong>🌍 WorldMetrics</strong>
<br><br>
© 2026 WorldMetrics
</footer>

<script>

const theme=document.getElementById("theme");

if(localStorage.getItem("worldmetrics-theme")==="dark"){
document.body.classList.add("dark");
theme.textContent="☀️";
}

theme.onclick=()=>{
document.body.classList.toggle("dark");

const dark=
document.body.classList.contains("dark");

localStorage.setItem(
"worldmetrics-theme",
dark?"dark":"light"
);

theme.textContent=dark?"☀️":"🌙";
};


let data=[];

async function load(){

try{

const response=
await fetch(
"https://restcountries.com/v3.1/all?fields=name,cca3,flags,population,region,capital"
);

data=await response.json();

data.sort(
(a,b)=>
a.name.common.localeCompare(
b.name.common
)
);

render(data);

}catch(error){

document.getElementById("countries")
.innerHTML=
"<p>Unable to load countries.</p>";

}

}


function render(list){

const container=
document.getElementById("countries");

container.innerHTML="";

list.forEach(country=>{

const card=
document.createElement("a");

card.className="card";

card.href=
"country.html?code="
+country.cca3;


card.innerHTML=`

<img
class="flag"
src="${country.flags.svg}"
alt="${country.name.common}"
>

<h2>
${country.name.common}
</h2>

<p>
👥 Population:
${country.population
?country.population.toLocaleString()
:"N/A"}
</p>

<p>
🌍 Region:
${country.region||"N/A"}
</p>

<p>
🏛️ Capital:
${country.capital
?country.capital[0]
:"N/A"}
</p>

`;

container.appendChild(card);

});

}


document.getElementById("search")
.addEventListener("input",e=>{

const query=
e.target.value.toLowerCase();

render(
data.filter(c=>
c.name.common
.toLowerCase()
.includes(query)
)
);

});


load();

</script>

</body>
</html>
